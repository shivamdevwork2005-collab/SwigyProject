<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html,
        body {
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 500px;
            /* height: 400px; */
            margin: 100px auto;
            border: solid;
            padding: 30px;
            border-radius: 20px;

            background: linear-gradient(135deg, #41295a, #2F0743);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .container>.box1 {
            display: flex;
            justify-content: space-between;
            padding-left: 25px;
            padding-right: 25px;
        }

        .container>.inp {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .container>.inp>input {
            padding: 5px;
            font-size: 30px;
            color: #FF5200;
            border-radius: 2px solid gray;
        }

        .container>.inp>button {
            font-size: 25px;
            padding: 10px;
            background-color: #FF5200;
            color: white;
            text-align: center;
            width: 90%;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
        }

        .container>.inp>button:hover {
            background-color: #c5661d;
            cursor:pointer;
        }

        .container>.inp>p {
            font-size: 16px;
            color: gray;
            font-weight: 700;
            padding: 12px;
            padding-left: 35px;
            margin-top: 20px;
        }
    </style>

</head>

<body>
    <div class="container">
        <div class="box1">
            <div class="cont" style="margin-top: 25px;">
                <h1 style="font-size: 32px; font-weight: 300; color: white;">Login</h1>
                <p>or <span style="color:#FF5200; font-weight: 400;">create an account</span> </p>
            </div>
            <img src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/Image-login_btpq7r"
                alt="" style="width: 130px; height: 130px; background-color: white; border-radius: 50%;">
        </div>

        <div class="inp">
            <input type="text" placeholder="Phoon Number">
            <button>Login</button>
            <p> <input type="checkbox"> By clicking on Login, I accept the Terms & Conditions & Privacy Policy</p>
        </div>
    </div>
</body>

</html>
