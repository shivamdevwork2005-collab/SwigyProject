<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="SignInPageForSwiggy.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <h2>Welcome To Swiggy.</h2>
        <label for="name"></label>
        <input type="text" placeholder="Enter your name" id="name">

        <label for="email"></label>
        <input type="email" id="email" placeholder="abc@gmail.com">

        <label for="phoon"></label>
        <input type="text" size="10" id="phoon" placeholder="+918840680388">

        <label for="password"></label>
        <input type="password" id="password" placeholder="Enter Password" minlength="5">

        <div class="btn">
            <button id="forgot">Forgot Password</button>
            <button id="signin">Signin</button>
        </div>

        <div class="login">
            <a href="login.html">login</a>
        </div>
    </div>
</body>

</html>
